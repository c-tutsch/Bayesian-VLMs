[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes_ref"
version = "0.0.0"
description = "Reference implementation of the Bayesian Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["bayes_ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
